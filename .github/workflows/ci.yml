name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Prisma client must be generated before tests import @prisma/client.
      # (Tests mock Prisma via backend/__mocks__/@prisma/client.js, so no DB is needed.)
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

  frontend:
    name: Frontend (lint, tests, typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

  e2e:
    name: E2E (Playwright, optional)
    runs-on: ubuntu-latest
    # Optional gate: e2e depends on a real DB + browser boot and can be flaky.
    # It does not block the pipeline (the required signal is backend + frontend).
    continue-on-error: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tiqr
          POSTGRES_PASSWORD: tiqr
          POSTGRES_DB: tiqr_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tiqr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Backend runtime env (Playwright boots the backend via `npm run dev`).
      DATABASE_URL: postgresql://tiqr:tiqr@localhost:5432/tiqr_e2e
      JWT_SECRET: ci-e2e-secret-at-least-32-characters-long
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      # Enables the journey specs (they self-skip when unset).
      E2E_HAS_DB: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Push schema to the throwaway Postgres
        working-directory: backend
        run: npx prisma db push --skip-generate

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # playwright.config.ts boots both dev servers itself (webServer[]),
      # so we don't start them by hand here.
      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7
