name: CI

on:
  push:
  pull_request:

# Make npm installs resilient to transient registry hiccups (ECONNRESET etc.)
# by bumping fetch retries/timeouts for every job. The per-step retry loop below
# is the belt-and-suspenders on top of this.
env:
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
  NPM_CONFIG_FETCH_TIMEOUT: "300000"

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          echo "npm ci failed after 3 attempts"; exit 1

      # Prisma client must be generated before tests import @prisma/client.
      # (Tests mock Prisma via backend/__mocks__/@prisma/client.js, so no DB is needed.)
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

  frontend:
    name: Frontend (lint, tests, typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          echo "npm ci failed after 3 attempts"; exit 1

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

  integration:
    name: Backend integration (real Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tiqr
          POSTGRES_PASSWORD: tiqr
          POSTGRES_DB: tiqr_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tiqr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://tiqr:tiqr@localhost:5432/tiqr_it
      JWT_SECRET: ci-it-secret-at-least-32-characters-long
      # Un-gate the integration suite (it self-skips unless this is "1"). This job
      # runs against a REAL Postgres and IS blocking, so a broken invariant fails CI.
      INTEGRATION_DB: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          echo "npm ci failed after 3 attempts"; exit 1

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema
        run: npx prisma db push --skip-generate

      - name: Apply DB CHECK constraints
        run: psql "$DATABASE_URL" -f prisma/constraints.sql

      - name: Run integration tests (real Postgres)
        run: npm run test:integration

  e2e:
    name: E2E (Playwright, optional)
    runs-on: ubuntu-latest
    # Optional gate: e2e depends on a real DB + browser boot and can be flaky.
    # It does not block the pipeline (the required signal is backend + frontend).
    continue-on-error: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tiqr
          POSTGRES_PASSWORD: tiqr
          POSTGRES_DB: tiqr_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tiqr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Backend runtime env (Playwright boots the backend via `npm run dev`).
      DATABASE_URL: postgresql://tiqr:tiqr@localhost:5432/tiqr_e2e
      JWT_SECRET: ci-e2e-secret-at-least-32-characters-long
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      # Enables the journey specs (they self-skip when unset).
      E2E_HAS_DB: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          # This job installs in three dirs; there is no root lock file, so point
          # the cache at each sub-project's lock file explicitly (otherwise
          # setup-node errors with "Dependencies lock file is not found").
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          echo "npm ci failed after 3 attempts"; exit 1

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Push schema to the throwaway Postgres
        working-directory: backend
        run: npx prisma db push --skip-generate

      # db push does not manage raw CHECK constraints; apply them explicitly so the
      # e2e stack exercises the same inventory invariant production should have.
      - name: Apply DB CHECK constraints
        working-directory: backend
        run: psql "$DATABASE_URL" -f prisma/constraints.sql

      - name: Install frontend deps
        working-directory: frontend
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          echo "npm ci failed after 3 attempts"; exit 1

      - name: Install e2e deps
        working-directory: e2e
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          echo "npm ci failed after 3 attempts"; exit 1

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # playwright.config.ts boots both dev servers itself (webServer[]),
      # so we don't start them by hand here.
      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7
