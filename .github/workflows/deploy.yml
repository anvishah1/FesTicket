name: Deploy

# OPS-08: build the backend image ONCE, deploy it to staging (its own Neon
# branch) with schema sync + smoke tests, then promote the SAME image (by digest,
# no rebuild) to production behind a manual-approval GitHub Environment.
#
# Prerequisites the operator configures (nothing secret is committed):
#   - Environments `staging` and `production` (Settings -> Environments). Put a
#     REQUIRED REVIEWERS protection rule on `production` — that IS the promote gate.
#   - Per-environment secrets: DATABASE_URL (pooled) + DIRECT_URL (unpooled, for
#     migrate deploy). Staging's MUST point at a SEPARATE Neon branch, never prod.
#   - Per-environment variables: API_URL (this backend's public base, for smoke).
#   - The container rollout step is host-specific (Fly/Render/Cloud Run/...) and is
#     a documented placeholder below — see ops/deploy.md.

on:
  push:
    branches: [anvi] # the repo's main branch — "merge to main auto-deploys"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & push backend image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      # GHCR requires a lowercase image path.
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (tagged with the commit SHA)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          # Reproducible layer caching between runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: ${{ vars.API_URL }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Apply committed migrations (schema + folded CHECK constraints) to the
      # staging Neon branch, USING THE SAME IMAGE (its pinned prisma + schema).
      - name: Migrate (staging DB)
        run: |
          docker run --rm \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            -e DIRECT_URL="${{ secrets.DIRECT_URL }}" \
            "${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}" \
            npx prisma migrate deploy

      # ---- container rollout (HOST-SPECIFIC — operator fills this in) ----
      # Roll out ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
      # to the staging service, e.g.:
      #   flyctl deploy --image <image@digest> --app tiqr-staging
      #   gcloud run deploy tiqr-staging --image <image@digest> --region ...
      #   curl -X POST "$RENDER_STAGING_DEPLOY_HOOK"
      - name: Roll out to staging (placeholder)
        run: |
          echo "TODO(operator) roll out ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }} to the staging host (see ops/deploy.md)."

      - name: Smoke test staging
        if: ${{ vars.API_URL != '' }}
        run: |
          base="${{ vars.API_URL }}"
          for path in /api/health /api/ready /api/hello; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "${base}${path}")
            echo "GET ${base}${path} -> ${code}"
            [ "$code" = "200" ] || { echo "::error::staging smoke failed at ${path} (HTTP ${code})"; exit 1; }
          done

  deploy-production:
    name: Promote to production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    # The `production` environment's required-reviewers rule gates this job — the
    # manual approval to promote. The SAME digest validated on staging ships here.
    environment:
      name: production
      url: ${{ vars.API_URL }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Promote WITHOUT rebuilding: retag the exact digest as :production.
      - name: Tag digest as :production (no rebuild)
        run: |
          docker buildx imagetools create \
            --tag "${{ needs.build.outputs.image }}:production" \
            "${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}"

      - name: Migrate (production DB)
        run: |
          docker run --rm \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            -e DIRECT_URL="${{ secrets.DIRECT_URL }}" \
            "${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}" \
            npx prisma migrate deploy

      - name: Roll out to production (placeholder)
        run: |
          echo "TODO(operator) roll out ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }} to the production host (see ops/deploy.md)."

      - name: Smoke test production
        if: ${{ vars.API_URL != '' }}
        run: |
          base="${{ vars.API_URL }}"
          for path in /api/health /api/ready /api/hello; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "${base}${path}")
            echo "GET ${base}${path} -> ${code}"
            [ "$code" = "200" ] || { echo "::error::production smoke failed at ${path} (HTTP ${code})"; exit 1; }
          done
