name: CI

on:
  push:
  pull_request:

# Make npm installs resilient to transient registry hiccups (ECONNRESET etc.)
# by bumping fetch retries/timeouts for every job. The per-step retry loop below
# is the belt-and-suspenders on top of this.
env:
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
  NPM_CONFIG_FETCH_TIMEOUT: "300000"

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          echo "npm ci failed after 3 attempts"; exit 1

      # Prisma client must be generated before tests import @prisma/client.
      # (Tests mock Prisma via backend/__mocks__/@prisma/client.js, so no DB is needed.)
      - name: Generate Prisma client
        run: npx prisma generate

      # OPS-01: run WITH coverage so the vitest.config.js thresholds gate the
      # build — a drop below the ratchet floor exits non-zero and fails CI.
      - name: Run tests (with coverage)
        run: npm run test:coverage

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage/lcov.info
            backend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend (lint, tests, typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          echo "npm ci failed after 3 attempts"; exit 1

      - name: Lint
        run: npm run lint

      # OPS-01: coverage-gated (frontend vitest.config.ts thresholds). A drop
      # below the ratchet floor exits non-zero and fails CI.
      - name: Run tests (with coverage)
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/lcov.info
            frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Typecheck
        run: npx tsc --noEmit

  integration:
    name: Backend integration (real Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tiqr
          POSTGRES_PASSWORD: tiqr
          POSTGRES_DB: tiqr_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tiqr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://tiqr:tiqr@localhost:5432/tiqr_it
      # directUrl is declared in schema.prisma (ARCH-06); Prisma requires the env
      # var to exist whenever declared. The throwaway Postgres is unpooled, so
      # point DIRECT_URL at the same URL as DATABASE_URL.
      DIRECT_URL: postgresql://tiqr:tiqr@localhost:5432/tiqr_it
      JWT_SECRET: ci-it-secret-at-least-32-characters-long
      # Un-gate the integration suite (it self-skips unless this is "1"). This job
      # runs against a REAL Postgres and IS blocking, so a broken invariant fails CI.
      INTEGRATION_DB: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          echo "npm ci failed after 3 attempts"; exit 1

      - name: Generate Prisma client
        run: npx prisma generate

      # ARCH-08: migrate deploy applies the committed migrations (schema + the
      # folded CHECK constraints), replacing the old `db push` + raw-SQL step. This
      # exercises the exact same migration path a real deploy uses.
      - name: Apply migrations (schema + CHECK constraints)
        run: npx prisma migrate deploy

      - name: Run integration tests (real Postgres)
        run: npm run test:integration

  e2e:
    name: E2E (Playwright, optional)
    runs-on: ubuntu-latest
    # Optional gate: e2e depends on a real DB + browser boot and can be flaky.
    # It does not block the pipeline (the required signal is backend + frontend).
    continue-on-error: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tiqr
          POSTGRES_PASSWORD: tiqr
          POSTGRES_DB: tiqr_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tiqr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Backend runtime env (Playwright boots the backend via `npm run dev`).
      DATABASE_URL: postgresql://tiqr:tiqr@localhost:5432/tiqr_e2e
      # directUrl is declared in schema.prisma (ARCH-06) and Prisma requires it to
      # exist; the throwaway Postgres is unpooled, so mirror DATABASE_URL.
      DIRECT_URL: postgresql://tiqr:tiqr@localhost:5432/tiqr_e2e
      JWT_SECRET: ci-e2e-secret-at-least-32-characters-long
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      # Enables the journey specs (they self-skip when unset).
      E2E_HAS_DB: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          # This job installs in three dirs; there is no root lock file, so point
          # the cache at each sub-project's lock file explicitly (otherwise
          # setup-node errors with "Dependencies lock file is not found").
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          echo "npm ci failed after 3 attempts"; exit 1

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      # ARCH-08: apply committed migrations (schema + folded CHECK constraints) via
      # migrate deploy — the same path a real deploy uses — instead of `db push`
      # plus a separate raw-SQL constraints step.
      - name: Apply migrations (schema + CHECK constraints)
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Install frontend deps
        working-directory: frontend
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          echo "npm ci failed after 3 attempts"; exit 1

      - name: Install e2e deps
        working-directory: e2e
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          echo "npm ci failed after 3 attempts"; exit 1

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # playwright.config.ts boots both dev servers itself (webServer[]),
      # so we don't start them by hand here.
      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7
